name: Feature request
description: Suggest an improvement for the local yt-dlp app
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep it local-first — we will not restore a public cloud download API.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Fits project rules
      options:
        - label: No ads, tracking, or mandatory cloud backends
          required: true
