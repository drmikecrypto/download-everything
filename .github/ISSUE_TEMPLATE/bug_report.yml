name: Bug report
description: Something broken in the desktop or Android app
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Redact cookies and private URLs.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.2.0 (from Settings footer or Releases tag)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Paste link → Analyze → …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Example URL (public only)
      description: Optional. Never paste cookies.txt contents.
