# Dependabot version updates — keep Actions / API / client tooling current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: pub
    directory: /apps/client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - legacy
    # Legacy tree — low priority; still alert on vulnerable deps

  - package-ecosystem: npm
    directory: /apps/worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - legacy
