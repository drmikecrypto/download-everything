name: Release Desktop & Mobile Apps

# Flutter pinned: 3.44+ macOS AOT crashes on _window_macos.dart (_Rect illegal cid).
# 3.41.9 is the last known-good stable for this project's macOS release builds.
# Revisit when https://github.com/flutter/flutter/issues/191575 (or successor) is fixed.

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match app-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match app-vX.Y.Z (got: $TAG)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-client-${{ env.FLUTTER_VERSION }}
      - name: Prepare app
        working-directory: apps/client
        run: |
          flutter pub get
          dart run tool/check_version.dart
          dart run tool/generate_icon.dart
          dart run flutter_launcher_icons
          dart run tool/fetch_binaries.dart --platform=windows
      - name: Build Windows
        working-directory: apps/client
        run: flutter build windows --release
      - name: Bundle yt-dlp binaries
        shell: pwsh
        run: |
          $dest = "apps/client/build/windows/x64/runner/Release"
          Copy-Item "apps/client/binaries/windows/yt-dlp.exe" $dest -Force
          Copy-Item "apps/client/binaries/windows/ffmpeg.exe" $dest -Force
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "apps/client/build/windows/x64/runner/Release/*" -DestinationPath dist/download-everything-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/download-everything-windows-x64.zip

  build-linux:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-client-${{ env.FLUTTER_VERSION }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xz-utils
      - name: Prepare app
        working-directory: apps/client
        run: |
          flutter pub get
          dart run tool/check_version.dart
          dart run tool/generate_icon.dart
          dart run flutter_launcher_icons
          dart run tool/fetch_binaries.dart --platform=linux
      - name: Build Linux
        working-directory: apps/client
        run: flutter build linux --release
      - name: Bundle yt-dlp binaries
        run: |
          DEST=apps/client/build/linux/x64/release/bundle
          cp apps/client/binaries/linux/yt-dlp "$DEST/"
          cp apps/client/binaries/linux/ffmpeg "$DEST/"
          chmod +x "$DEST/yt-dlp" "$DEST/ffmpeg"
      - name: Package Linux
        run: |
          mkdir -p dist
          tar -czf dist/download-everything-linux-x64.tar.gz -C apps/client/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/download-everything-linux-x64.tar.gz

  build-macos:
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-client-${{ env.FLUTTER_VERSION }}
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Prepare app
        working-directory: apps/client
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          dart run tool/check_version.dart
          dart run tool/generate_icon.dart
          dart run flutter_launcher_icons
          dart run tool/fetch_binaries.dart --platform=macos
      - name: Build macOS
        working-directory: apps/client
        run: flutter build macos --release
      - name: Bundle yt-dlp binaries
        run: |
          APP_PATH=$(find apps/client/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          cp apps/client/binaries/macos/yt-dlp "$MACOS_DIR/"
          cp apps/client/binaries/macos/ffmpeg "$MACOS_DIR/"
          chmod +x "$MACOS_DIR/yt-dlp" "$MACOS_DIR/ffmpeg"
      - name: Package macOS
        run: |
          mkdir -p dist
          APP_PATH=$(find apps/client/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/download-everything-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/download-everything-macos-universal.zip

  build-android:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-client-${{ env.FLUTTER_VERSION }}
      - name: Prepare app
        working-directory: apps/client
        run: |
          flutter pub get
          dart run tool/check_version.dart
          dart run tool/generate_icon.dart
          dart run flutter_launcher_icons
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/client/android/app/release.keystore
            echo "KEYSTORE_READY=1" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — APK will use debug signing (local/dev only)."
            echo "KEYSTORE_READY=0" >> "$GITHUB_ENV"
          fi
      - name: Build Android APK
        working-directory: apps/client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${KEYSTORE_READY}" = "1" ]; then
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/client/android/app/release.keystore"
          fi
          flutter build apk --release
      - name: Package Android
        run: |
          mkdir -p dist
          cp apps/client/build/app/outputs/flutter-apk/app-release.apk dist/download-everything-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/download-everything-android.apk

  release:
    needs: [validate-tag, build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: Download Everything Apps ${{ needs.validate-tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/download-everything-windows-x64.zip
            artifacts/download-everything-linux-x64.tar.gz
            artifacts/download-everything-macos-universal.zip
            artifacts/download-everything-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
